<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Directory</title>
    <base href="https://mattgoral.github.io/uccb_fair_24/">
    <link rel="stylesheet" href="main.css">
</head>
<body>
<script>
    const locations = {
        barn: {i:'nftGC56p51pmZbhG8', n:'Barn'},
        parsonage: {i:'gjvJUC8UixNaFLtT6', n:'Parsonage'},
        lowerLot: {i:'dMfV8wkKRnKf3Uxv9', n:'Lower Parking Lot'},
        lowerLevel: {i:'7o7KVBYPkCsYkxQX6', n:'Inside Lower Level'},
        upperLevel: {i:'mhyBH9yboV5h47598', n:'Inside Upper Level'},
        courtyard: {i:'VfMEzUcBYbPtPALk7', n:'Courtyard'},
        sanctuary: {i:'NwXLodhPenUWUwo8A', n:'Sanctuary'}
    }
    function location_link(location) {
        return `https://maps.app.goo.gl/${location}`
    }
    const booths = [
        {
            displayName: 'Autumn Harvest',
            gmap: locations.courtyard,
            desc: 'It’s time for the harvest!<br>Come see our beautiful selection of mums, pumpkins, gourds and local honey.'
        }, {
            displayName: 'Bake Shop',
            gmap: locations.upperLevel,
            desc: 'Bring something home or enjoy it at the fair!<br>Fresh baked cakes, cookies, pies and other delicious treats<br>There are even Gluten Free options!'
        }, {
            displayName: 'Barn',
            gmap: locations.barn,
            desc: 'You just have to see it!<br>Our barn and surrounding grounds are stuffed with huge bargains.<br>I am sure there is something you need! (Or just want)'
        }, {
            displayName: 'Cheese Booth',
            gmap: locations.lowerLevel,
            desc: 'Indulge in the rich, creamy goodness of our aged cheddar cheese—perfectly balanced with sharpness and a hint of nuttiness.'
        }, {
            displayName: 'Coffee Shop',
            gmap: locations.lowerLevel,
            desc: 'Take a break and visit our coffee shop, where the aroma of freshly brewed coffee meets an irresistible selection of homemade snacks.'
        }, {
            displayName: 'Fudge Shop',
            gmap: locations.lowerLevel,
            desc: 'Treat yourself to our amazing fudge from a local shop.<br>We have many kinds available; you will have to try them all!'
        }, {
            displayName: 'Garden Shop',
            gmap: locations.courtyard,
            desc: 'Enjoy looking through a beautiful selection of plants, and flowers.<br>There must be something you can’t go home without!'
        }, {
            displayName: 'Grill',
            gmap: locations.lowerLot,
            desc: 'Early visitors come get your egg sandwich to get the morning going.<br>Ready for lunch?  Come to the grill and enjoy hot dogs, hamburgers and other items.'
        }, {
            displayName: 'Quilts',
            gmap: locations.upperLevel,
            desc: 'Amazing finely crafted handmade quilts.<br>You really need to see these!'
        }, {
            displayName: 'Second Hand Rose',
            gmap: locations.parsonage,
            desc: 'Need your new fall wardrobe?<br>Come look through our fine selection of gently used clothes.'
        }, {
            displayName: 'SERRV',
            gmap: locations.upperLevel,
            desc: 'Fair trade gifts, handmade crafts & foods sourced globally from artisans around the world.'
        }, {
            displayName: 'She Shed',
            gmap: locations.upperLevel,
            desc: 'Who needs a "Man Cave" when you can visit the "She Shed" - A boutique style set up of jewelry, purses, scarves and beautiful items to spoil yourself or find a gift.'
        }, {
            displayName: 'Silent Auction',
            gmap: locations.sanctuary,
            desc: 'Who will place the highest bid and win the prize?<br>Come see the huge variety of items at the auction and place your best bid.  Good luck!'
        }, {
            displayName: 'Used Books',
            gmap: locations.lowerLevel,
            desc: 'We finished reading these, now it\'s your turn!  Select from thousands of titles at super bargain prices!'
        }, {
            displayName: 'White Steeple Inn',
            gmap: locations.sanctuary,
            desc: 'While enjoying the fair, take some time to sit down and relax and enjoy a tasty lunch served at your table or get takeout if you want to stay on the move!'
        }
    ]

    class Booth extends HTMLElement {
        TOGGLE_EL = 'inner'
        style = `<style>
            #${this.TOGGLE_EL} {
                max-height: 0;
                overflow: hidden;
                transition: all .1s;
            }
            #${this.TOGGLE_EL}.open {
                max-height: 1000vh;
            }
            #booth {
                padding: 2vh 5vw;
                border-bottom: 1px solid #aaa;
            }
            #booth-name {
                font-size: 4em;
                font-weight: bold;
            }
            #location {
                display: flex;
                padding: 2vh 0;
            }
            #loc-icon {
                height: 1.4em;
                margin: .2em 1vw 0 0;
            }
            #loc-icon > path { fill: #777 }
            #gmap > a {
                color: #777;
                text-decoration: none;
                font-weight: bold;
                font-size: 2em;
            }
            #desc {
                line-height: 1.5em;
                font-size: 3em;
            }

        </style>`

        template = `<template>
            <div id="booth">
                <div id="booth-name" class="button">
                    <slot name="displayName"></slot>
                </div>
                <div id="inner">
                    <div id="location">
                        <svg id="loc-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
                            <path d="M215.7 499.2C267 435 384 279.4 384 192C384 86 298 0 192 0S0 86 0 192c0 87.4 117 243 168.3 307.2c12.3 15.3 35.1 15.3 47.4 0zM192 128a64 64 0 1 1 0 128 64 64 0 1 1 0-128z"/>
                        </svg>
                        <div id="gmap"></div>
                    </div>
                    <div id="desc">
                        <slot name="desc"></slot>
                    </div>
                </div>
            </div>
        </template>`


        constructor(b) {
            super();
            this.open = false
            const shadowRoot = this.attachShadow({ mode: "open" });
            shadowRoot.appendChild(new DOMParser()
                .parseFromString(this.style, 'text/html')
                .querySelector('style')
                .cloneNode(true)
            )
            shadowRoot.appendChild(new DOMParser()
                .parseFromString(this.template, 'text/html')
                .querySelector('template')
                .content
                .cloneNode(true)
            )
            this.appendChild(this.displayName = document.createElement('span'))
            this.displayName.slot = 'displayName'
            this.displayName.innerHTML = b.displayName

            shadowRoot.getElementById('gmap').appendChild(this.gmap = document.createElement('a'))
            this.gmap.innerHTML = b.gmap.n
            this.gmap.href = location_link(b.gmap.i)
            this.gmap.target = '_blank'

            this.appendChild(this.desc = document.createElement('span'))
            this.desc.slot = 'desc'
            this.desc.innerHTML = b.desc

            shadowRoot.querySelector('.button').onclick = this.toggle.bind(this)

        }
        toggle() {
            this.open = !this.open
            let e = this.shadowRoot.getElementById(this.TOGGLE_EL)
            return this.open ? e.classList.add('open') : e.classList.remove('open')
        }
    }
    customElements.define("uccb-booth", Booth);
    booths.forEach(b => document.body.appendChild(new Booth(b)))

</script>
<script src="nav/nav.js"></script>
</body>
</html>
